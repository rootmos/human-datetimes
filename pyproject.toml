[project]
name = "human-datetimes"
version = "0.1.4"
requires-python = ">=3.13,<4"
dependencies = [
    "dateparser (>=1.4.0,<2)",
    "python-dateutil (>=2.9.0,<4)",
    "cron-converter (>=1.3.1,<2)",
    "holidays (>=0.101,<1)",
    "pytz (==2026.3)",
    "tzdata (==2026.3)",
]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
parameterized = ">=0.9.0,<0.10"

[tool.isort]
sort_relative_in_force_sorted_sections = true
sections = ['FUTURE', 'STDLIB', 'LOCALFOLDER', 'FIRSTPARTY', 'THIRDPARTY']

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s:%(name)s:%(levelname)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"
