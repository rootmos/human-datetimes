[project]
name = "human-datetimes"
version = "0.1.8"
requires-python = ">=3.13,<4"
dependencies = [
    "dateparser (>=1.4.3,<2)",
    "python-dateutil (>=2.9.0,<4)",
    "cron-converter (>=2.0.2,<3)",
    "holidays (>=0.106,<1)",
    "pytz (==2026.5)",
    "tzdata (==2026.5)",
]

[project.optional-dependencies]
cli = [
    "argcomplete (>=3.7.2,<4.0.0)",
]

[project.scripts]
human-datetime = "human_datetimes.cli:main"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
parameterized = ">=0.9.0,<0.10"

[tool.isort]
sort_relative_in_force_sorted_sections = true
sections = ['FUTURE', 'STDLIB', 'LOCALFOLDER', 'FIRSTPARTY', 'THIRDPARTY']

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s:%(name)s:%(levelname)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
